ems:start;margin-bottom:18px}.summary .product-visual{aspect-ratio:1;padding:12px}.summary .product-visual b{font-size:16px}.summary h3{margin-top:0}.summary .price{font-size:18px}.saved-list{max-width:720px}.coupon{border:2px solid var(--pink);background:#fff6f9;padding:24px;margin:18px 0;border-radius:6px}.coupon-number{font-size:42px;letter-spacing:-.04em;font-weight:800;color:var(--pink)}.coupon-number span{font-size:22px}.coupon small{display:block}.success{padding:16px;background:#edf7f0;color:#286943;margin:16px 0;font-size:14px}.notification{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:460px;width:calc(100% - 32px);background:#fff;box-shadow:0 6px 40px #0003;border:1px solid #e1e1e1;border-radius:16px;padding:18px;z-index:20}.notification[hidden]{display:none}.notification .row{align-items:flex-start}.notification strong{font-size:14px}.notification p{font-size:14px}.notification .close{padding:6px;font-size:20px}.notification .btn{min-height:44px}.sticky{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;gap:28px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));z-index:5}.sticky button{font-size:14px;min-height:44px;padding:8px 4px}.sticky button.active{color:var(--pink);font-weight:700}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#292929;color:#fff;padding:14px 20px;border-radius:8px;max-width:calc(100% - 32px);width:max-content;z-index:30;font-size:14px}.hide{display:none!important}.empty{padding:40px 0;color:#666}.coupon-check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6;padding:15px;background:#fff2f6}.coupon-check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--pink)}

.product-visual{padding:0;display:block;background:#f5f5f5}.product-visual img{display:block;width:100%;height:100%;object-fit:contain}.summary .product-visual{padding:0}.coupon-source{font-size:12px;line-height:1.7;color:#777;margin-top:12px}.coupon-source a{color:#666;text-decoration:underline}</style><link rel="stylesheet" href="./lab.css"><link rel="stylesheet" href="./style.css"></head><body data-concept="oshii"><div class="demo-strip">CONCEPT APP · 商品・店舗・クーポンはデモです</div><header><button class="brand" onclick="view('home')">oshii<span class="brand-dot">.</span><small>惜しいを、好きに。</small></button><div class="header-actions"><button onclick="view('saved')">惜しい <span class="count" id="savedCount">0</span></button><button onclick="view('coupons')">クーポン <span class="count" id="couponCount">0</span></button></div></header><form class="search" onsubmit="event.preventDefault();searchProducts()"><input id="search" type="search" aria-label="商品を検索" placeholder="商品名・カテゴリーから探す"><button type="submit" aria-label="検索">検索</button></form><nav class="category-bar" id="categories" aria-label="カテゴリー"></nav><main id="app" class="shell"></main><nav id="bottom" class="sticky" aria-label="画面切替"></nav><div class="toast hide" id="toast" role="status"></div><aside id="notification" class="notification" aria-label="お店からのクーポン通知" hidden><div class="row"><strong>OSHII · 丸井の近くで</strong><button class="close" onclick="dismissNotice()" aria-label="通知を閉じる">×</button></div><p id="notificationText" role="status"></p><button class="btn full" onclick="openNotice()">クーポンを見る</button></aside><script>
const products=[
{id:'jacket',name:'コットンブレンド ジャケット',category:'ジャケット',brand:'DAY STANDARD',price:8900,color:'ネイビー',size:'M',floor:'4F',store:'デモ館 DAY STANDARD',desc:'軽く羽織れる、普段使いの一着。肩の落ち方や生地の厚みは、店舗で確認できます。'},
{id:'knit',name:'洗える クルーネックニット',category:'ニット',brand:'EVERYDAY',price:5900,color:'アイボリー',size:'M',floor:'4F',store:'デモ館 EVERYDAY',desc:'毎日に使いやすいシンプルなニット。肌ざわりや色味を、買う前に確かめて。'},
{id:'bag',name:'軽量 2WAYトートバッグ',category:'バッグ',brand:'DAILY GOODS',price:6900,color:'ブラック',size:'FREE',floor:'4F',store:'デモ館 DAILY GOODS',desc:'持ち方を変えられる日常用のバッグ。重さや容量を、現物で確かめられます。'}
];
const state={view:'home',selected:'jacket',category:'すべて',query:'',reason:'サイズが不安',saved:{},coupons:{},notice:null};
const $=id=>document.getElementById(id);let timer;const yen=n=>'¥'+n.toLocaleString();const item=()=>products.find(p=>p.id===state.selected);
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hide');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hide'),3200)}
function view(v){if(v==='visit'&&!state.saved[state.selected]){const first=Object.keys(state.saved)[0];if(first)state.selected=first;}state.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function choose(id,v='detail'){state.selected=id;state.reason=state.saved[id]?.reason||'サイズが不安';view(v)}
function category(c){state.category=c;view('home')}
function searchProducts(){state.query=$('search').value.trim();view('home')}
function heading(t,sub=''){return `<div class="breadcrumb"><button onclick="view('home')">商品を探す</button><span>/</span>${t}</div><div class="section-head"><h1>${t}</h1>${sub}</div>`}
function icon(name){const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',saved:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',coupons:'<path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/><path d="M15 6v2m0 3v2m0 3v2"/>',visit:'<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>'};return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||''}</svg>`}
function visual(p){return `<div class="product-visual"><img src="./assets/${p.id}.webp" alt="${p.color}の${p.name}の生成イメージ" width="900" height="900" loading="lazy"></div>`}
function summary(p){return `<div class="summary">${visual(p)}<div><small>${p.brand}</small><h3>${p.name}</h3><p class="muted">${p.color} / ${p.size}</p><p class="price">${yen(p.price)} <small>税込</small></p></div></div>`}
function couponValid(id){const c=state.coupons[id];return !!c&&!c.used&&Date.now()<c.expires;}
function expiry(c){return new Date(c.expires).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'まで';}
function couponCard(p){const c=state.coupons[p.id];if(!c)return '';return `<div class="coupon"><span class="tag">ショップのwebクーポン · デモ</span><h3>${p.store}</h3><div class="coupon-number"><small>SHOP COUPON</small>1,000<span>円 OFF</span></div><p>${p.name}</p><small>対象ショップのクーポン対象商品をECで購入すると使えます。会員ログインが必要です。</small><div class="ledger">税込5,000円以上 / 対象ショップの対象商品 / 1回限り（デモ）<br>デモ有効期限：${expiry(c)}</div>${c.used?'<b class="muted">利用済み</b>':!couponValid(p.id)?'<b class="muted">有効期限が切れています</b>':`<button class="btn full" onclick="choose('${p.id}','visit')">お店で商品を確かめる</button>`}<p class="coupon-source">金額条件の参考：<a href="https://voi.0101.co.jp/voi/webCouponLp/showWebCouponLp" target="_blank" rel="noopener noreferrer">マルイウェブチャネルの開催中クーポン</a>（2026年10月7日確認）。ショップ・期限はデモ設定で、会員ログイン済みの状態を再現しています。</p></div>`}
function saveItem(){const p=item();state.saved[p.id]={...state.saved[p.id],reason:state.reason,fit:state.saved[p.id]?.fit||'ちょうどいい'};view('saved');toast('「惜しい」に保存しました')}
const noticeStorageKey='oshii:last-notice-day:v1';let lastNoticeDay='';
function japanDay(now=new Date()){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);}
function notifiedToday(){let stored='';try{stored=localStorage.getItem(noticeStorageKey)||'';}catch{}return lastNoticeDay===japanDay()||stored===japanDay();}
function rememberNotice(){lastNoticeDay=japanDay();try{localStorage.setItem(noticeStorageKey,lastNoticeDay);}catch{toast('通知回数はこの画面を開いている間だけ記録されます。');}}
function approach(id){
 if(!state.saved[id])return;
 if(notifiedToday()){dismissNotice();toast('本日の通知は送信済みです。次の通知は明日、丸井の近くに来たときです。');return;}
 const p=products.find(p=>p.id===id);state.selected=id;
 if(!state.coupons[id])state.coupons[id]={expires:Date.now()+24*60*60*1000,used:false};
 if(!couponValid(id)){view('coupons');toast('このクーポンは利用済み、または期限切れです');return;}
 rememberNotice();state.notice=id;render();$('notificationText').textContent=`丸井の近くに来ました。${p.store}で、気になっていた「${p.name}」を確かめませんか？1,000円OFFのwebクーポンが使えます。本日の通知はこの1回だけです。`;$('notification').hidden=false;
}

function dismissNotice(){$('notification').hidden=true;}
function openNotice(){dismissNotice();state.selected=state.notice;view('coupons')}
function recordFit(){state.saved[state.selected].tried=true;render();toast('店舗での確認結果を保存しました')}
function checkout(){const saved=state.saved[state.selected];if(!saved?.tried){toast('まず店舗での確認結果を残してください');return;}saved.apply=couponValid(state.selected);view('checkout')}
function discount(){const p=item(),saved=state.saved[p.id];return saved?.apply&&saved.tried&&couponValid(p.id)&&p.price>=5000?1000:0;}
function order(){const saved=state.saved[state.selected];if(!saved?.tried||saved.ordered)return;const off=discount();saved.paid=item().price-off;saved.discount=off;saved.ordered=true;if(off)state.coupons[state.selected].used=true;render();toast('購入体験が完了しました')}
function render(){
 $('savedCount').textContent=Object.keys(state.saved).length;$('couponCount').textContent=Object.keys(state.coupons).filter(couponValid).length;
 $('categories').innerHTML=['すべて','ジャケット','ニット','バッグ'].map(c=>`<button class="${state.category===c?'active':''}" onclick="category('${c}')">${c}</button>`).join('');
 $('bottom').innerHTML=[['home','見つける'],['saved','惜しいリスト'],['coupons','クーポン'],['visit','お店で確認']].map(([v,t])=>`<button class="${state.view===v?'active':''}" onclick="view('${v}')">${icon(v)}<span>${t}</span></button>`).join('');
 $('app').innerHTML=screen();
}
function screen(){const p=item(),saved=state.saved[p.id];
 if(state.view==='home'){const list=products.filter(p=>(state.category==='すべて'||p.category===state.category)&&(!state.query||[p.name,p.brand,p.category].some(v=>v.toLowerCase().includes(state.query.toLowerCase()))));return `<div class="section-head discovery-head"><div><span class="eyebrow">FIND YOUR NEXT FAVORITE</span><h1>気になる、を見つけよう。</h1><p class="muted">あと一歩で欲しいもの。お店で確かめて、自宅へ。</p></div><small>${list.length} items</small></div><div class="shop-strip"><div class="strip-icon">${icon('saved')}</div><div><b>まだ決めなくていい。まずは「惜しい」に。</b><p>お店の近くで、確かめるきっかけが届きます。</p></div><span class="strip-label">1日1回</span></div><div class="products">${list.map(p=>`<button class="product-card" onclick="choose('${p.id}')"><div class="catalog-photo">${visual(p)}<span class="save-mark ${state.saved[p.id]?'is-saved':''}">${icon('saved')}</span><span class="photo-label">${p.category}</span></div><div class="product-meta"><small>${p.brand}</small><h3>${p.name}</h3><p class="price">${yen(p.price)} <small>税込</small></p><span class="tag">${state.saved[p.id]?'惜しいに保存済み':'店舗で確認できます'}</span></div></button>`).join('')}</div>${list.length?'':'<p class="empty">該当する商品がありません。検索語やカテゴリーを変えてください。</p>'}<p class="note">商品・ブランドは架空のサンプルです。写真はこのデモ用に生成したオリジナル画像で、実在商品の写真ではありません。</p>`;}
 if(state.view==='detail')return heading(p.category)+`<div class="detail-grid"><div>${visual(p)}<p class="note">オリジナルの生成イメージ / ${p.color}</p></div><section class="detail-info"><span class="eyebrow">${p.brand}</span><h1>${p.name}</h1><p class="price">${yen(p.price)} <small>税込</small></p><p>${p.desc}</p><div class="ledger"><b>カラー：</b>${p.color}<br><b>サイズ：</b>${p.size}</div><span class="tag">店舗で現物を確認できます</span><h3 class="reason-title">あと一歩、何が気になる？</h3><div class="choices">${['サイズが不安','質感を見たい','色を確かめたい','価格で迷う'].map(r=>`<button class="${state.reason===r?'selected':''}" onclick="state.reason='${r}';render()">${r}</button>`).join('')}</div><button class="btn full" onclick="saveItem()">${saved?'「惜しい」の理由を更新':'「惜しい」に残す'}</button><p class="muted" style="margin-top:14px">丸井の近くに来たときだけ、クーポン通知は1日1回。</p></section></div>`;
 if(state.view==='saved')return heading('惜しいリスト',`<small>${Object.keys(state.saved).length}件</small>`)+`<div class="saved-list">${products.filter(p=>state.saved[p.id]).map(p=>`<section class="card">${summary(p)}<span class="tag">${state.saved[p.id].reason}</span><p class="muted">${state.saved[p.id].tried?'店舗で確認済み':'まだ現物を確認していません'}</p><button class="btn secondary full" onclick="approach('${p.id}')">丸井の近くに来た場面を体験</button>${state.coupons[p.id]?`<button class="btn ghost full" onclick="choose('${p.id}','coupons')">届いたクーポンを見る</button>`:''}<button class="btn ghost full" onclick="choose('${p.id}')">商品詳細を見る</button></section>`).join('')||'<p class="empty">気になる商品を「惜しい」に残してみよう。</p>'}<p class="note">通知は日本時間で1日1回、商品やショップをまたいで共通です。同じ日に近くへ戻っても再通知しません。この端末に最終通知日だけを記録します。近接検知・通知はボタンで再現しています。実際の位置情報やバックグラウンド通知とは連動していません。</p></div>`;
 if(state.view==='coupons')return heading('クーポン',`<small>近くのお店から</small>`)+`<div class="saved-list">${state.coupons[p.id]?couponCard(p):''}${products.filter(q=>q.id!==p.id&&state.coupons[q.id]).map(couponCard).join('')}${Object.keys(state.coupons).length?'':'<div class="card"><h2>まだクーポンは届いていません</h2><p class="muted">丸井の近くに来たとき、「惜しい」に残した商品の対象ショップのwebクーポンを1日1回お知らせします。</p><button class="btn full" onclick="view(\'saved\')">惜しいリストを見る</button></div>'}<p class="note">割引額・最低利用金額は公式掲載のショップクーポンに合わせています。対象ショップ・利用期限・会員条件は実際の各クーポンに従います。この画面は発行・利用のデモです。</p></div>`;
 if(state.view==='visit')return heading('店舗で確認')+`<div class="saved-list"><section class="card">${summary(p)}<div class="ledger"><b>${p.store} · ${p.floor}</b><p class="muted">${p.size}サイズを確認できます · デモ在庫</p></div>${!saved?'<p>まず商品を「惜しい」に残してください。</p><button class="btn full" onclick="view(\'home\')">商品を探す</button>':`<p>気になっていた理由：<b>${saved.reason}</b></p>${saved.tried?`<div class="success">確認結果：${saved.fit}</div>${saved.fit==='ちょうどいい'?'<button class="btn full" onclick="checkout()">ECで購入・自宅へ配送</button>':'<p class="muted">確認できたことも、大切な発見。別の商品も探してみよう。</p><button class="btn secondary full" onclick="view(\'home\')">ほかの商品を見る</button>'}<button class="btn ghost full" onclick="state.saved[state.selected].tried=false;render()">確認結果を変える</button>`:`<h3>現物を確認して、どうでしたか？</h3><div class="choices">${['ちょうどいい','イメージと違う','今回は見送る'].map(f=>`<button class="${saved.fit===f?'selected':''}" onclick="state.saved[state.selected].fit='${f}';render()">${f}</button>`).join('')}</div><button class="btn full" onclick="recordFit()">確認結果を残す</button>`}`}</section>${state.coupons[p.id]?couponCard(p):''}</div>`;
 if(state.view==='checkout'){if(!saved?.tried)return '<p>店舗での確認結果を先に残してください。</p>';const off=discount();return heading('購入・自宅へ配送')+`<div class="saved-list"><section class="card">${summary(p)}<div class="success">店舗で確認：${saved.fit}</div>${!saved.ordered&&couponValid(p.id)?`<label class="coupon-check"><input type="checkbox" ${saved.apply?'checked':''} onchange="state.saved[state.selected].apply=this.checked;render()"><span>ショップのwebクーポンを使う<br><b>1,000円OFF</b> / デモ期限 ${expiry(state.coupons[p.id])}</span></label>`:''}<div class="ledger row"><span>商品代金</span><b>${yen(p.price)}</b></div><div class="ledger row"><span>クーポン</span><b class="pink">−${yen(saved.ordered?saved.discount:off)}</b></div><div class="ledger row"><span>送料（デモ）</span><b>¥0</b></div><div class="ledger row"><span>お支払い合計</span><b class="price">${yen(saved.ordered?saved.paid:p.price-off)}</b></div><div class="ledger"><b>配送先</b><p class="muted">登録済みの自宅（デモ）</p></div>${saved.ordered?'<div class="success">購入体験が完了しました。決済・配送は行われません。</div>':'<button class="btn full" onclick="order()">購入を体験する</button>'}</section></div>`;}
 return '';
}
render();
</script><script src="./lab.js"></script></body></html>
